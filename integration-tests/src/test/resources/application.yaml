spring:
  kafka:
    consumer:
      group-id: my-group
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false

app:
  # Each test boots the full app context against a fresh, empty TestContainers Postgres, which
  # would otherwise trigger DemoDataSeeder and pollute every test's starting state.
  demo-data:
    enabled: false