name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Least privilege: once the repository is public, pull requests from forks run this
# workflow. Neither job writes to the repository, so a read-only token is sufficient.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: ./mvnw -B clean install

  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      # The layout check (feature 025) drives the built SPA in a real browser at 320, 375 and
      # 1280 px and fails if any screen scrolls sideways. It needs a browser, which `npm ci` does
      # not install; --with-deps also pulls the shared libraries a headless Chromium needs on a
      # bare runner. It runs against the artefact the step above just produced, so it costs a
      # browser download and nothing else.
      - name: Install Chromium for the layout check
        run: npx playwright install --with-deps chromium

      - name: Layout check (no screen scrolls sideways)
        run: npx playwright test

      # Traces are written only for failures. Without them a red layout check tells you a number
      # and not which component was 4px too wide.
      - name: Upload layout traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
