openapi: "3.0.0"
info:
  title: "Delete Account API"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /accounts/{id}:
    delete:
      summary: "Delete an account"
      operationId: deleteAccount
      tags:
        - accountDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "Deleted successfully"
        "404":
          description: "Not found"
        "409":
          description: "Account is referenced by a bill or income"
        default:
          description: "Unexpected error"
