openapi: "3.0.0"
info:
  title: "Update Account API"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /accounts/{id}:
    put:
      summary: "Update an account"
      operationId: updateAccount
      tags:
        - accountUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "account-model.yaml#/components/schemas/updateAccountRequest"
      responses:
        "200":
          description: "Updated account"
          content:
            application/json:
              schema:
                $ref: "account-model.yaml#/components/schemas/accountResponse"
        "400":
          description: "Invalid request"
        "404":
          description: "Not found"
        "409":
          description: "Account name already exists"
        default:
          description: "Unexpected error"
