components:
  schemas:
    transactionType:
      type: "string"
      enum:
        - BILL
        - INCOME

    recurringSeriesStatus:
      type: "string"
      description: >
        PROPOSED - detected, awaiting the operator. CONFIRMED - expected to continue, and posts its
        own transactions. DISMISSED - the detection was wrong. STOPPED - it was real and has ended.
        DISMISSED and STOPPED are deliberately distinct: one is a judgement about the detection, the
        other a fact about the world.
      enum:
        - PROPOSED
        - CONFIRMED
        - DISMISSED
        - STOPPED

    recurringFrequency:
      type: "string"
      enum:
        - DAILY
        - WEEKLY
        - MONTHLY
        - YEARLY

    recurringSeriesResponse:
      type: "object"
      properties:
        id:
          type: "string"
          format: "uuid"
        transactionType:
          $ref: '#/components/schemas/transactionType'
        groupKey:
          type: "string"
          description: "The category id this series groups on for a BILL series, or the income source name (e.g. SALARY) for an INCOME series — income has no category, so its source is the closest equivalent."
        description:
          type: "string"
        frequency:
          $ref: '#/components/schemas/recurringFrequency'
        status:
          $ref: '#/components/schemas/recurringSeriesStatus'
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"

    recurringSeriesListResponse:
      type: "object"
      properties:
        series:
          type: "array"
          items:
            $ref: '#/components/schemas/recurringSeriesResponse'

    upcomingRecurringItem:
      type: "object"
      properties:
        seriesId:
          type: "string"
          format: "uuid"
        transactionType:
          $ref: '#/components/schemas/transactionType'
        groupKey:
          type: "string"
          description: "See recurringSeriesResponse.groupKey"
        description:
          type: "string"
        predictedDate:
          type: "string"
          format: "date-time"
        predictedAmount:
          type: "number"
        overdue:
          type: "boolean"
          description: "True when predictedDate has passed with no matching new transaction recorded yet"

    priceChangeAlert:
      type: "object"
      properties:
        transactionId:
          type: "string"
          format: "uuid"
          description: "The newly recorded occurrence whose amount differs from the series' prior amount"
        transactionType:
          $ref: '#/components/schemas/transactionType'
        groupKey:
          type: "string"
          description: "See recurringSeriesResponse.groupKey"
        description:
          type: "string"
        priorAmount:
          type: "number"
        newAmount:
          type: "number"
        delta:
          type: "number"
          description: "newAmount minus priorAmount; positive means the charge increased"

    recurringDashboardResponse:
      type: "object"
      properties:
        upcoming:
          type: "array"
          items:
            $ref: '#/components/schemas/upcomingRecurringItem'
        recentPriceChanges:
          type: "array"
          items:
            $ref: '#/components/schemas/priceChangeAlert'

    recurringCostSummaryItem:
      type: "object"
      properties:
        seriesId:
          type: "string"
          format: "uuid"
        description:
          type: "string"
        monthlyEquivalentAmount:
          type: "number"
          description: "Most recent occurrence amount, normalized to a monthly-equivalent using the series' frequency"
        originalAmount:
          type: "number"
          description: "Earliest recorded occurrence's amount"
        priceIncreased:
          type: "boolean"
          description: "True when the most recent occurrence amount exceeds originalAmount beyond the existing amount-tolerance rule"
        increaseAmount:
          type: "number"
          description: "Most recent occurrence amount minus originalAmount; only meaningful when priceIncreased is true"

    recurringCostSummaryResponse:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: '#/components/schemas/recurringCostSummaryItem'
