openapi: "3.0.0"
info:
  title: "Create Category API"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /categories:
    post:
      summary: "Create a new category"
      tags:
        - categoryCreate
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "category-model.yaml#/components/schemas/createCategoryRequest"
      responses:
        "201":
          description: "Newly created category"
          content:
            application/json:
              schema:
                $ref: "category-model.yaml#/components/schemas/categoryResponse"
        "400":
          description: "Invalid request"
        "409":
          description: "Category name already exists"
        default:
          description: "Unexpected error"
