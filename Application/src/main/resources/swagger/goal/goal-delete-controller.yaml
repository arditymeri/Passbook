openapi: "3.0.0"
info:
  title: "Personal Finance Service - Savings Goal Delete API"
  description: "Delete a savings goal"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /savings-goals/{id}:
    delete:
      summary: "Delete a savings goal"
      operationId: deleteSavingsGoal
      description: "Removes the goal record. Never deletes or modifies the linked account or its transactions."
      tags:
        - goalDelete
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "204":
          description: "Deleted successfully"
        "404":
          description: "Goal not found"
        default:
          description: "Unexpected error"
