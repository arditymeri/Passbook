openapi: "3.0.0"
info:
  title: "Personal Finance Service - Savings Goal Get API"
  description: "List savings goals, or fetch one, with derived progress"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /savings-goals:
    get:
      summary: "List all savings goals"
      operationId: listSavingsGoals
      description: "Returns every savings goal with its derived saved amount, percent complete, remaining amount, achieved status, and (when a target date is set) pace status."
      tags:
        - goalGet
      responses:
        "200":
          description: "Savings goal list returned"
          content:
            application/json:
              schema:
                $ref: "goal-model.yaml#/components/schemas/savingsGoalListResponse"
        default:
          description: "Unexpected error"

  /savings-goals/{id}:
    get:
      summary: "Get a single savings goal"
      operationId: getSavingsGoal
      description: "Returns one savings goal with its derived progress."
      tags:
        - goalGet
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Savings goal returned"
          content:
            application/json:
              schema:
                $ref: "goal-model.yaml#/components/schemas/savingsGoalResponse"
        "404":
          description: "Goal not found"
        default:
          description: "Unexpected error"
