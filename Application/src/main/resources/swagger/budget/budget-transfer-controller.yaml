openapi: "3.0.0"
info:
  title: "Personal Finance Service - Budget Transfer API"
  description: "Move money from one category's envelope balance to another's"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /budgets/transfer:
    post:
      summary: "Move an amount between two category envelope balances"
      operationId: transferAllocation
      description: >
        Records a transfer from one category's envelope balance to another's. Does not change the
        overall unallocated total — it only changes which category the money is attributed to.
      tags:
        - budgetTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "budget-model.yaml#/components/schemas/transferAllocationRequest"
      responses:
        "200":
          description: "Transfer recorded successfully"
          content:
            application/json:
              schema:
                $ref: "budget-model.yaml#/components/schemas/transferAllocationResponse"
        "400":
          description: "Invalid request (amount ≤ 0, source and destination category identical, amount exceeds source's current envelope balance, invalid month)"
        "404":
          description: "Category not found"
        default:
          description: "Unexpected error"
