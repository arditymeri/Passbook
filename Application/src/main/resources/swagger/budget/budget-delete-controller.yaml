openapi: "3.0.0"
info:
  title: "Personal Finance Service - Budget Delete API"
  description: "Delete a budget entry by ID"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /budgets/{id}:
    delete:
      summary: "Delete a budget by ID"
      operationId: deleteBudget
      description: "Permanently removes the budget entry with the given ID"
      tags:
        - budgetDelete
      parameters:
        - name: id
          in: path
          required: true
          description: "Budget ID"
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Budget deleted successfully"
        "404":
          description: "Budget not found"
        default:
          description: "Unexpected error"
