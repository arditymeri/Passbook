openapi: "3.0.0"
info:
  title: "Create Income API"
  description: "API to create a new income entry"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /incomes:
    post:
      summary: "Create a new income"
      tags:
        - incomeCreate
      operationId: createIncome
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "income-model.yaml#/components/schemas/createIncomeRequest"
      responses:
        "201":
          description: "Newly created income"
          content:
            application/json:
              schema:
                $ref: "income-model.yaml#/components/schemas/incomeResponse"
        "400":
          description: "Invalid request"
        default:
          description: "Unexpected error"
