components:
  schemas:
    syncAccount:
      type: "object"
      properties:
        id: { type: "string", format: "uuid" }
        name: { type: "string" }
        type: { type: "string" }
        currencies: { type: "array", items: { type: "string" } }
        defaultCurrency: { type: "string" }
        balance:
          type: "string"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
          description: "Opening balance, decimal string (Constitution Principle IV)"
        institution: { type: "string" }
        updatedAt: { type: "string", format: "date-time" }

    syncCategory:
      type: "object"
      properties:
        id: { type: "string", format: "uuid" }
        name: { type: "string" }
        type: { type: "string" }
        color: { type: "string" }
        parentCategoryId: { type: "string" }
        updatedAt: { type: "string", format: "date-time" }

    syncBudget:
      type: "object"
      properties:
        id: { type: "string", format: "uuid" }
        categoryId: { type: "string" }
        year: { type: "integer" }
        month: { type: "integer" }
        limitAmount:
          type: "string"
          pattern: "^\\d+(\\.\\d{1,2})?$"
        updatedAt: { type: "string", format: "date-time" }

    syncRecurringSeries:
      type: "object"
      properties:
        id: { type: "string", format: "uuid" }
        transactionType: { type: "string", enum: [BILL, INCOME] }
        groupKey: { type: "string" }
        description: { type: "string" }
        frequency: { type: "string", enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        # STOPPED added by feature 023. A stopped series must survive a device sync: without
        # it the receiving device would see a CONFIRMED series and resume auto-posting a
        # subscription the operator has already cancelled.
        status: { type: "string", enum: [PROPOSED, CONFIRMED, DISMISSED, STOPPED] }
        createdAt: { type: "string", format: "date-time" }
        updatedAt: { type: "string", format: "date-time" }

    syncBill:
      type: "object"
      properties:
        id: { type: "string", format: "uuid" }
        description: { type: "string" }
        amount:
          type: "string"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        time: { type: "string", format: "date-time" }
        categoryId: { type: "string" }
        accountId: { type: "string" }
        correctsTransactionId: { type: "string" }
        reversal: { type: "boolean" }
        necessityTag: { type: "string", enum: [NECESSARY, AVOIDABLE, UNNECESSARY] }
        necessityTagUpdatedAt: { type: "string", format: "date-time" }
        recordedAt: { type: "string", format: "date-time" }

    syncIncome:
      type: "object"
      properties:
        id: { type: "string", format: "uuid" }
        description: { type: "string" }
        amount:
          type: "string"
          pattern: "^-?\\d+(\\.\\d{1,2})?$"
        currency: { type: "string" }
        time: { type: "string", format: "date-time" }
        source: { type: "string" }
        payer: { type: "string" }
        accountId: { type: "string" }
        notes: { type: "string" }
        recurring: { type: "boolean" }
        recurringFrequency: { type: "string", enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        correctsTransactionId: { type: "string" }
        reversal: { type: "boolean" }
        recordedAt: { type: "string", format: "date-time" }

    syncSavingsGoal:
      type: "object"
      properties:
        id: { type: "string", format: "uuid" }
        name: { type: "string" }
        targetAmount:
          type: "string"
          pattern: "^\\d+(\\.\\d{1,2})?$"
        targetDate: { type: "string", format: "date-time" }
        accountId: { type: "string" }
        createdAt: { type: "string", format: "date-time" }
        updatedAt: { type: "string", format: "date-time" }

    syncSnapshot:
      type: "object"
      required: [schemaVersion, exportedAt]
      properties:
        schemaVersion:
          type: "integer"
          description: "Import rejects any value it does not recognize exactly (FR-010)"
        exportedAt: { type: "string", format: "date-time" }
        accounts: { type: "array", items: { $ref: '#/components/schemas/syncAccount' } }
        categories: { type: "array", items: { $ref: '#/components/schemas/syncCategory' } }
        budgets: { type: "array", items: { $ref: '#/components/schemas/syncBudget' } }
        recurringSeries: { type: "array", items: { $ref: '#/components/schemas/syncRecurringSeries' } }
        bills: { type: "array", items: { $ref: '#/components/schemas/syncBill' } }
        incomes: { type: "array", items: { $ref: '#/components/schemas/syncIncome' } }
        savingsGoals: { type: "array", items: { $ref: '#/components/schemas/syncSavingsGoal' } }

    importSummaryCounts:
      type: "object"
      properties:
        added: { type: "integer" }
        updated: { type: "integer" }
        unchanged: { type: "integer" }

    importSummary:
      type: "object"
      properties:
        applied:
          type: "boolean"
          description: "false from /sync/import/preview, true from /sync/import/apply"
        accounts: { $ref: '#/components/schemas/importSummaryCounts' }
        categories: { $ref: '#/components/schemas/importSummaryCounts' }
        budgets: { $ref: '#/components/schemas/importSummaryCounts' }
        recurringSeries: { $ref: '#/components/schemas/importSummaryCounts' }
        bills: { $ref: '#/components/schemas/importSummaryCounts' }
        incomes: { $ref: '#/components/schemas/importSummaryCounts' }
        savingsGoals: { $ref: '#/components/schemas/importSummaryCounts' }
        correctionConflictsResolved:
          type: "integer"
          description: "Count of cases where two sibling corrections of the same original bill/income were found; the more recently recorded one was kept as current"
