components:
  schemas:
    billResponseModel:
      type: "object"
      properties:
        common:
          type: "object"
          properties:
            success:
              type: "boolean"
            message:
              type: "string"
        bill:
          $ref: '#/components/schemas/bill'
    billListResponseModel:
      type: "object"
      properties:
        common:
          type: "object"
          properties:
            success:
              type: "boolean"
            message:
              type: "string"
        bills:
          type: "array"
          items:
            $ref: '#/components/schemas/bill'
    bill:
      type: "object"
      properties:
        id:
          format: "uuid"
          type: "string"
        amount:
          type: "number"
          format: "double"
        description:
          type: "string"
        time:
          type: "string"
          format: "date-time"
        date:
          type: "string"
          format: "date"
        categoryId:
          type: "string"
        billItems:
          type: "array"
          items:
            $ref: '#/components/schemas/billItem'

    billItem:
      type: "object"
      properties:
        name:
          type: "string"
        amount:
          type: "number"
          format: "double"