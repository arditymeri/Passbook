components:
  schemas:
    billResponseModel:
      type: "object"
      properties:
        common:
          type: "object"
          properties:
            success:
              type: "boolean"
            message:
              type: "string"
        bill:
          $ref: '#/components/schemas/bill'
    billListResponseModel:
      type: "object"
      properties:
        common:
          type: "object"
          properties:
            success:
              type: "boolean"
            message:
              type: "string"
        bills:
          type: "array"
          items:
            $ref: '#/components/schemas/bill'
    bill:
      type: "object"
      properties:
        id:
          format: "uuid"
          type: "string"
        amount:
          type: "number"
          format: "double"
        description:
          type: "string"
        time:
          type: "string"
          format: "date-time"
        date:
          type: "string"
          format: "date"
        categoryId:
          type: "string"
        accountId:
          type: "string"
        correctsTransactionId:
          type: "string"
        reversal:
          type: "boolean"
        recurringSeriesId:
          type: "string"
          description: >
            Set when this transaction was posted by a confirmed recurring series rather than entered
            by a person or imported from a statement. Additive and optional: a client that ignores it
            sees exactly what it saw before.
        necessityTag:
          $ref: '#/components/schemas/necessityTag'
          nullable: true
        necessityTagUpdatedAt:
          type: "string"
          format: "date-time"
        recordedAt:
          type: "string"
          format: "date-time"
          description: "When this row was first written - not the transaction's occurrence time (time)"
        billItems:
          type: "array"
          items:
            $ref: '#/components/schemas/billItem'

    necessityTag:
      type: "string"
      enum:
        - NECESSARY
        - AVOIDABLE
        - UNNECESSARY

    billItem:
      type: "object"
      properties:
        name:
          type: "string"
        amount:
          type: "number"
          format: "double"

    correctBillRequest:
      type: "object"
      required:
        - amount
        - time
      properties:
        amount:
          # Decimal string, not a JSON number: Constitution Principle IV forbids floating-point
          # for money on any layer, including `number` in JS/TS. Parsed to BigDecimal in the
          # controller. Sign is excluded here — negative amounts are system-generated reversals
          # only, never user input.
          type: "string"
          pattern: "^\\d+(\\.\\d{1,2})?$"
          example: "45.50"
        description:
          type: "string"
        time:
          type: "string"
          format: "date-time"
        categoryId:
          type: "string"
        accountId:
          type: "string"

    updateNecessityTagRequest:
      type: "object"
      properties:
        tag:
          # Nullable: absent or null clears the tag back to untagged.
          $ref: '#/components/schemas/necessityTag'
          nullable: true

    billHistoryResponse:
      type: "object"
      properties:
        history:
          type: "array"
          description: "Prior values of this bill, newest first, ending with the original (reversal rows excluded)"
          items:
            $ref: '#/components/schemas/bill'