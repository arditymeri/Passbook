components:
  schemas:
    authStatus:
      type: "object"
      properties:
        adminAccountConfigured:
          type: "boolean"
          description: "false until /auth/setup has succeeded once; true forever after"

    setupRequest:
      type: "object"
      required: [username, password]
      properties:
        username:
          type: "string"
          minLength: 1
        password:
          type: "string"
          # 12, not the usual 8: this is ONE credential, chosen once, protecting an entire
          # financial history, on a URL strangers can reach. NIST's floor of 8 assumes an account
          # among many behind other controls. Enforced here AND in Domain (PasswordPolicy) so the
          # rule does not live only in a generated artifact.
          minLength: 12

    loginRequest:
      type: "object"
      required: [username, password]
      properties:
        username:
          type: "string"
        password:
          # DELIBERATELY unconstrained, and it must stay that way. A minimum here would reject a
          # short password before checking it — telling the caller the stored password is short —
          # and would lock out every account created before the rule existed. The minimum applies
          # where a password is SET, never where one is used (FR-010).
          type: "string"

    changePasswordRequest:
      type: "object"
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: "string"
        newPassword:
          type: "string"
          # Same minimum as setup, same reasoning. See setupRequest.password above.
          minLength: 12

    session:
      type: "object"
      properties:
        token:
          type: "string"
          description: "JWT bearer token - send as `Authorization: Bearer <token>` on every subsequent request"
        username:
          type: "string"
        expiresAt:
          type: "string"
          format: "date-time"
