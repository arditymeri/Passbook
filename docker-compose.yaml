services:

  postgres:
    image: postgres:latest
    container_name: my-finance-postgres-container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: myfinance
      POSTGRES_USER: diti
      POSTGRES_PASSWORD: FinanceDbPassword
    networks:
      - finance-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: my-finance-pgadmin-container
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - finance-net


  kafka:
    image: debezium/kafka:2.7.3.Final
    ports:
      - "8670:8670"
      - "9092:9092"
    environment:

      CLUSTER_ID: 9JO5JNfXSjc7MtoAPO3fZg
      NODE_ID: 1
      KAFKA_CONTROLLER_QURUM_VOTERS: 1@akka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://:8670,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:8670
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAME: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CREATE_TOPICS: "booking.topic:1:1,transaction.topic:1:1"
    networks:
      - finance-net

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.7.1.arm64
    depends_on:
      - kafka
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:9092
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONTROL_CENTER_CONNECT_CLUSTER: kafka:9092
    networks:
      - finance-net


  kafdrop:
    image: obsidiandynamics/kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKER_CONNECT: kafka:9092
    depends_on:
      - kafka
    networks:
      - finance-net

  finance-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - postgres
    networks:
      - finance-net

networks:
  finance-net:
    driver: bridge