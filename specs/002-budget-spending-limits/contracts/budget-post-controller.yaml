openapi: "3.0.0"
info:
  title: "Personal Finance Service - Budget API"
  description: "Create or update a monthly spending budget for a category"
  version: "1.0.0"
servers:
  - url: "http://localhost:8080/api/v1"
paths:
  /budgets:
    post:
      summary: "Create or update a monthly budget"
      operationId: createOrUpdateBudget
      description: "Creates a spending limit for a category and month. If a budget already exists for the same category and month, its limit is updated (upsert)."
      tags:
        - budgetCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "budget-model.yaml#/components/schemas/createBudgetRequest"
      responses:
        "200":
          description: "Budget created or updated successfully"
          content:
            application/json:
              schema:
                $ref: "budget-model.yaml#/components/schemas/budgetResponse"
        "400":
          description: "Invalid request (limit ≤ 0, missing required fields, invalid month)"
        "404":
          description: "Category not found"
        default:
          description: "Unexpected error"
