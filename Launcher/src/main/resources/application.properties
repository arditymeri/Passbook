server.servlet.context-path=/api/v1

# The release identifier, so an operator can read it off a running instance via
# GET /system/version rather than inspecting source or build files (feature 021, FR-013).
# spring-boot-starter-parent already configures Maven resource filtering with @...@ delimiters
# for application*.properties, so this resolves at build time with no extra plugin.
app.version=@project.version@

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=booking.group.id
spring.kafka.consumer.auto-offset-reset=earliest

# Every secret comes from the operator's environment; nothing in this repository grants access
# to anyone's database. Copy .env.example to .env and fill it in (see README).
#
# POSTGRES_PASSWORD has NO default on purpose. An unresolvable placeholder makes startup fail
# naming the variable, which is the point: a built-in fallback is what makes every install share
# a credential. URL and username keep defaults because neither is a secret.
#
# The username default is `diti` rather than something tidier because that is the role name in
# every already-running instance: changing it would break an upgrade for no benefit. A fresh
# install can set POSTGRES_USER to anything; an upgrading one must not.
spring.datasource.url= ${DATABASE_URL:jdbc:postgresql://postgres:5432/myfinance}
spring.datasource.username= ${POSTGRES_USER:diti}
spring.datasource.password= ${POSTGRES_PASSWORD}

# Signs session tokens. Empty default so JwtTokenService can fail with a message that explains
# what this is for, rather than Spring's generic unresolvable-placeholder error.
app.security.jwt-secret= ${JWT_SECRET:}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect

# Schema is owned by Flyway (Infrastructure/src/main/resources/db/migration), never inferred.
# `validate` makes Hibernate refuse to start when the database disagrees with the entity
# mappings, WITHOUT altering anything - the opposite of the old `update`, which silently
# reshaped an operator's database at every startup.
#
# Known limit, stated so nobody over-trusts it: validate checks tables, columns and column
# types. It does not check indexes, unique constraints, foreign keys, defaults or constraint
# names, so a stale leftover column will not fail startup.
spring.jpa.hibernate.ddl-auto= validate

# Adopt an already-running instance instead of rebuilding it. On a non-empty database with no
# history table, Flyway stamps a BASELINE row at version 1 and skips V1 entirely; on an empty
# database V1 runs normally. Same schema either way - see V1__baseline_schema.sql.
spring.flyway.baseline-on-migrate= true
spring.flyway.baseline-version= 1

# Flyway's default, set explicitly because a real behaviour depends on it: restoring a backup
# taken from a NEWER version into older code leaves an applied migration the running code cannot
# resolve, and this is what turns that into a refusal to start rather than old code writing
# against a newer schema.
spring.flyway.validate-on-migrate= true

# Seeds realistic demo data (accounts, categories, 6 months of bills/income, a confirmed
# recurring rent/subscription/salary pattern, an envelope budget, a savings goal) on first
# startup against an empty database. Safe to leave on: it only runs once, guarded by the
# accounts table being empty, so a later restart never duplicates data. Set to false to disable.
app.demo-data.enabled= true